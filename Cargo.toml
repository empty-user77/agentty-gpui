# Generated by scripts/apply_agentty.py from zed/zed-workspace.toml. Don't edit by hand:
# change the script and rerun it.

[workspace]
resolver = "2"
members = [
    "crates/bench_metrics",
    "crates/collections",
    "crates/gpui",
    "crates/gpui_apple",
    "crates/gpui_linux",
    "crates/gpui_macos",
    "crates/gpui_macros",
    "crates/gpui_platform",
    "crates/gpui_shared_string",
    "crates/gpui_util",
    "crates/gpui_wgpu",
    "crates/gpui_windows",
    "crates/http_client",
    "crates/refineable",
    "crates/refineable/derive_refineable",
    "crates/scheduler",
    "crates/sum_tree",
    "crates/zlog",
    "crates/ztracing",
    "crates/ztracing_macro",
]
exclude = [
    "crates/gpui_ios",
    "crates/gpui_web",
]

[workspace.package]
version = "0.1.1"
edition = "2024"
publish = true
repository = "https://github.com/empty-user77/agentty-gpui"

[workspace.dependencies]
accesskit = { version = "0.24.0", features = ["enumn"] }
accesskit_macos = "0.26.0"
accesskit_unix = "0.22"
accesskit_windows = "0.34"
anyhow = "1.0.86"
