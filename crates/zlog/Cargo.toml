# Modified for Agentty by scripts/apply_agentty.py (package name, version, dependencies).
[package]
name = "agentty-gpui-zlog"
description = "Zed's zlog crate, as used by agentty-gpui"
repository.workspace = true
version.workspace = true
edition.workspace = true
publish.workspace = true
license = "Apache-2.0"

[lints]
workspace = true

[lib]
name = "zlog"
path = "src/zlog.rs"
doctest = false

[features]
default = []

[dependencies]
collections.workspace = true
chrono = { workspace = true, default-features = true }
log = { workspace = true, features = ["kv_unstable_std"] }
anyhow.workspace = true

[dev-dependencies]
tempfile.workspace = true
