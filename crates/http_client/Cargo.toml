# Modified for Agentty by scripts/apply_agentty.py (package name, version, dependencies).
[package]
name = "agentty-gpui-http-client"
repository.workspace = true
version.workspace = true
edition.workspace = true
publish.workspace = true
license = "Apache-2.0"
description = "A HTTP client library for Zed and GPUI"

[lints]
workspace = true

[features]
test-support = ["dep:log"]

[lib]
name = "http_client"
path = "src/http_client.rs"
test = false
doctest = false

[dependencies]
anyhow.workspace = true
bytes.workspace = true
futures.workspace = true
http-body.workspace = true
http.workspace = true
log = { workspace = true, optional = true }
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_urlencoded.workspace = true
url.workspace = true
