# Modified for Agentty by scripts/apply_agentty.py (package name, version, dependencies).
[package]
name = "agentty-gpui-sum-tree"
repository.workspace = true
version.workspace = true
edition.workspace = true
publish.workspace = true
license = "Apache-2.0"
description = "A sum tree data structure, a concurrency-friendly B-tree"

[lints]
workspace = true

[lib]
name = "sum_tree"
path = "src/sum_tree.rs"
doctest = false

[dependencies]
heapless.workspace = true
rayon.workspace = true
ztracing.workspace = true
tracing.workspace = true
proptest = { workspace = true, optional = true }

[dev-dependencies]
log.workspace = true
ctor.workspace = true
rand.workspace = true
proptest.workspace = true
zlog = { path = "../zlog", package = "agentty-gpui-zlog" }


[package.metadata.cargo-shear]
ignored = ["tracing"]

[features]
test-support = ["proptest"]
