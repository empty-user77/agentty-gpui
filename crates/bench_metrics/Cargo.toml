# Modified for Agentty by scripts/apply_agentty.py (package name, version, dependencies).
[package]
name = "agentty-gpui-bench-metrics"
description = "Zed's bench_metrics crate, as used by agentty-gpui"
repository.workspace = true
version.workspace = true
edition.workspace = true
publish.workspace = true
license = "Apache-2.0"

[lints]
workspace = true

[lib]
name = "bench_metrics"
path = "src/bench_metrics.rs"
doctest = false

[features]
test-support = []

[dependencies]
anyhow.workspace = true
criterion.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
perf-event.workspace = true
