# Modified for Agentty by scripts/apply_agentty.py (package name, version, dependencies).
[package]
name = "agentty-gpui-macros"
repository.workspace = true
version.workspace = true
edition.workspace = true
publish.workspace = true
license = "Apache-2.0"
description = "Macros used by gpui"

[lints]
workspace = true

[features]
inspector = []

[lib]
name = "gpui_macros"
path = "src/gpui_macros.rs"
proc-macro = true
doctest = true
test = false

[dependencies]
heck.workspace = true
proc-macro2.workspace = true
quote.workspace = true
syn = { workspace = true, default-features = true, features = ["full", "extra-traits", "visit-mut"] }

[dev-dependencies]
gpui = { path = "../gpui", package = "agentty-gpui", default-features = false, features = ["inspector"] }
