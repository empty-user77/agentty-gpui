name: Agentty

# Builds and tests Agentty against this checkout of agentty-gpui, on every platform Agentty ships
# for, before anything is published: run it after a Zed sync or an Agentty patch, with the Agentty
# branch to try (main once Agentty uses agentty-gpui).
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Agentty branch, tag or commit
        default: main
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  agentty:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: agentty
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: gpui
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: empty-user77/Agentty
          ref: ${{ inputs.ref }}
          path: agentty
          persist-credentials: false
      - name: System libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends build-essential pkg-config \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libxcb1-dev \
            libvulkan-dev libfontconfig-dev libfreetype-dev libzstd-dev libsqlite3-dev zsh >/dev/null
      - name: Install toolchain
        run: rustup toolchain install
      - name: Use this agentty-gpui
        run: |
          # A Windows path (D:/a/...) on Windows, where cargo is not a Git Bash program.
          gpui="$(cd ../gpui && (pwd -W 2>/dev/null || pwd))"
          mkdir -p .cargo
          {
            echo '[patch.crates-io]'
            echo "agentty-gpui = { path = '$gpui/crates/gpui' }"
            echo "agentty-gpui-platform = { path = '$gpui/crates/gpui_platform' }"
          } > .cargo/config.toml
          cat .cargo/config.toml
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: agentty
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Clippy without voice
        run: cargo clippy -p agentty-app -p agentty-bridge -p agentty-db --no-default-features --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Release build
        run: cargo build --release -p agentty-app
      # The built app, started for real: it has to stay up and draw. Screenshots of the first
      # screen, a terminal and a few pages are uploaded with the run (nobody watches a runner's
      # screen, and macOS is the only platform built and looked at locally).
      - name: Smoke run (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y -qq --no-install-recommends xvfb imagemagick mesa-vulkan-drivers \
            netcat-openbsd fonts-dejavu-core fonts-noto-cjk fonts-noto-color-emoji >/dev/null
          xvfb-run -a -s "-screen 0 1600x1000x24" ../gpui/scripts/smoke.sh "$PWD/target/release/agentty" "$RUNNER_TEMP/smoke"
      - name: Smoke run (macOS)
        if: runner.os == 'macOS'
        run: ../gpui/scripts/smoke.sh "$PWD/target/release/agentty" "$RUNNER_TEMP/smoke"
      - name: Smoke run (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'smoke'
          New-Item -ItemType Directory -Force $out | Out-Null
          $env:AGENTTY_DATA_DIR = Join-Path $out 'data'
          $app = Start-Process -FilePath target\release\agentty.exe -PassThru `
            -RedirectStandardOutput (Join-Path $out 'app.out.log') -RedirectStandardError (Join-Path $out 'app.log')
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          function Shot($name) {
            $screen = [System.Windows.Forms.SystemInformation]::VirtualScreen
            $bitmap = New-Object System.Drawing.Bitmap $screen.Width, $screen.Height
            $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
            $graphics.CopyFromScreen($screen.Left, $screen.Top, 0, 0, $bitmap.Size)
            $bitmap.Save((Join-Path $out "$name.png"))
          }
          Start-Sleep -Seconds 20
          if ($app.HasExited) { Get-Content (Join-Path $out 'app.log') -Tail 50; throw "Agentty exited with $($app.ExitCode)" }
          Shot '01-first-screen'
          Start-Sleep -Seconds 10
          if ($app.HasExited) { Get-Content (Join-Path $out 'app.log') -Tail 50; throw "Agentty exited with $($app.ExitCode)" }
          Shot '02-later'
          Stop-Process -Id $app.Id -Force
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: smoke-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/smoke/*.png
            ${{ runner.temp }}/smoke/*.log
          if-no-files-found: warn
          retention-days: 7
